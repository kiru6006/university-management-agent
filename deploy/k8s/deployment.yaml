apiVersion: apps/v1
kind: Deployment
metadata:
  name: uniops-backend
  namespace: uniops-production
  labels:
    app: uniops-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: uniops-backend
  template:
    metadata:
      labels:
        app: uniops-backend
    spec:
      containers:
      - name: backend
        image: uniops/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: uniops-backend-svc
  namespace: uniops-production
spec:
  selector:
    app: uniops-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
